<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1000, user-scalable=yes, maximum-scale=5.0">
<title>来听小董讲故事</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#111;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    font-family:monospace}
  #stage{position:relative;width:min(96vw,1000px);height:min(70vh,640px);
    min-height:400px;overflow:hidden}

  #sceneLayer{position:absolute;inset:0;cursor:pointer}
  #scene{position:absolute;inset:0;width:100%;height:100%;
    image-rendering:pixelated;transition:opacity .5s}
  .actor{position:absolute;bottom:-10%;
    transform:translateX(-50%);
    transition:left 1.2s ease-in-out, opacity .5s;
    animation:bob .5s steps(2) infinite;z-index:5}
  .actor img{display:block;image-rendering:pixelated;
    image-rendering:crisp-edges;transition:opacity .3s,filter .3s}
  @keyframes bob{
    0%{transform:translateX(-50%) translateY(0)}
    100%{transform:translateX(-50%) translateY(-6px)}
  }
  .actor.slant{animation:none;
    transform:translateX(-50%) rotate(-8deg) translateY(-10px)}
  .actor.orbit{animation:none;transition:none;z-index:6;
    transform:translate(-50%,-50%)}
  .actor.noBob{animation:none;transform-origin:bottom center}
  @keyframes dropIn{
    0%{transform:translateX(-50%) translateY(-500px);opacity:0}
    20%{opacity:1}
    100%{transform:translateX(-50%) translateY(0)}
  }
  .actor.drop{animation:dropIn .9s cubic-bezier(.5,0,1,1) forwards}
  @keyframes walkBack{
    0%,100%{transform:translateX(-50%) translateX(-30px)}
    50%{transform:translateX(-50%) translateX(30px)}
  }
  .actor.walk{animation:walkBack 2.5s ease-in-out infinite}
  @keyframes skateLeftRight{
    0%{transform:translateX(-50%) translateX(0) rotate(0)}
    25%{transform:translateX(-50%) translateX(-40px) rotate(-4deg)}
    50%{transform:translateX(-50%) translateX(0) rotate(0)}
    75%{transform:translateX(-50%) translateX(40px) rotate(4deg)}
    100%{transform:translateX(-50%) translateX(0) rotate(0)}
  }
  .actor.skate{animation:skateLeftRight 4s ease-in-out infinite}

  #bubble{position:absolute;padding:12px 16px;background:#fff;color:#111;
    border:5px solid #111;font-size:17px;max-width:55%;opacity:0;
    transition:opacity .3s;z-index:10;line-height:1.5;
    box-shadow:5px 5px 0 rgba(0,0,0,.3);font-weight:bold}
  #bubble.show{opacity:1}
  #bubble::after{content:'';position:absolute;
    left:50%;margin-left:-7px;bottom:-15px;
    border:7px solid transparent;border-top-color:#111}

  #narr{position:absolute;left:0;right:0;bottom:2%;text-align:center;
    color:#fff;font-size:20px;padding:0 24px;
    opacity:0;transition:opacity .4s;z-index:9;line-height:1.7;
    text-shadow:
      2px 0 0 #000, -2px 0 0 #000, 0 2px 0 #000, 0 -2px 0 #000,
      2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;}
  #narr.show{opacity:1}
  #narr span{background:rgba(0,0,0,.65);padding:6px 14px;
    border-radius:4px;display:inline-block}

  #title{position:absolute;left:16px;top:14px;color:#fff;font-size:15px;
    text-shadow:2px 2px 0 #000;z-index:11;font-weight:bold}

  #chapterScreen{
    position:absolute;inset:0;
    background:linear-gradient(#0a0a1a,#1a1a3a);
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    z-index:50;opacity:0;transition:opacity .5s;pointer-events:none}
  #chapterScreen.show{opacity:1;pointer-events:auto}
  #chapterScreen .num{
  font-size:64px;color:#ffd966;font-weight:bold;
  text-shadow:4px 4px 0 #000;margin-bottom:16px;font-family:serif}
  #chapterScreen .num:empty{display:none}
  #chapterScreen .name{
  font-size:24px;color:#fff;letter-spacing:2px;
  text-shadow:3px 3px 0 #000;font-family:serif;
  text-align:center;padding:0 40px;line-height:1.7;max-width:720px}
  #chapterScreen .line{
    width:120px;height:4px;background:#ffd966;margin-top:24px}

  #controls{position:absolute;right:16px;top:14px;z-index:25;
    display:flex;gap:20px}
  #controls button{
    font-family:monospace;font-size:14px;padding:4px 0;
    background:transparent;color:#fff;border:none;cursor:pointer;
    font-weight:bold;text-decoration:underline;
    text-shadow:1px 1px 0 #000}
  #controls button:active{transform:translate(1px,1px)}
  #controls button:disabled{opacity:.35;cursor:default;text-decoration:none}

  .snow{position:absolute;width:4px;height:4px;background:#fff;
    border-radius:50%;opacity:.85;animation:fall linear infinite;z-index:6}
  @keyframes fall{
    from{transform:translateY(-10px)}
    to{transform:translateY(420px)}
  }
  .fw{position:absolute;width:7px;height:7px;border-radius:50%;
    animation:boom 1.2s ease-out forwards;z-index:7}
  @keyframes boom{
    0%{transform:translate(0,0) scale(1);opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}
  }
  .bag{position:absolute;z-index:4;
    animation:bagPulse 2s ease-in-out infinite;transform-origin:center}
  @keyframes bagPulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.05)}
  }
  .umbrella{position:absolute;z-index:8;
    animation:umbrellaIn .8s ease-out forwards;
    transform-origin:center bottom;opacity:0}
  @keyframes umbrellaIn{
    0%{transform:scale(0) rotate(-20deg);opacity:0}
    60%{transform:scale(1.1) rotate(5deg);opacity:1}
    100%{transform:scale(1) rotate(0);opacity:1}
  }
  .award-fx,.cert-fx{position:absolute;left:50%;
    transform:translateX(-50%);z-index:20;transition:top 1.5s ease-out}
  .award-fx{top:-180px}
  .cert-fx{top:-200px}
  .prop{position:absolute;z-index:6;opacity:0;transition:opacity .5s}
  .prop.show{opacity:1}
  @keyframes sweepMove{
    0%,100%{transform:rotate(-15deg)}
    50%{transform:rotate(15deg)}
  }
  @keyframes scarfPop{
    0%{transform:translate(-50%,-50%) scale(0);opacity:0}
    50%{transform:translate(-50%,-50%) scale(1.5);opacity:1}
    100%{transform:translate(-50%,-50%) scale(1.2);opacity:1}
  }
  @keyframes heartGlow{
    0%,100%{transform:translate(-50%,-50%) scale(1);
      filter:drop-shadow(0 0 15px #ff4d4d) drop-shadow(0 0 30px #ff8ab4)}
    50%{transform:translate(-50%,-50%) scale(1.08);
      filter:drop-shadow(0 0 30px #ff4d4d) drop-shadow(0 0 60px #ff8ab4)}
  }
  @keyframes photoFlash{
    0%,100%{opacity:0}
    50%{opacity:.9}
  }
  @keyframes fadeToWhite{
    from{opacity:0}
    to{opacity:1}
  }

  .hidden{display:none!important}

  #quizScreen{
    position:absolute;inset:0;
    background:linear-gradient(#2a2a3a,#1a1a28);
    padding:28px;display:none;
    flex-direction:column;justify-content:center;
    z-index:60;overflow-y:auto}
  #quizScreen.show{display:flex}
  #quizScreen .q{font-size:16px;color:#fff;margin:0 0 16px;line-height:1.6}
  #quizScreen .opts{display:flex;flex-direction:column;gap:10px}
  #quizScreen .opt{padding:12px 16px;background:#2f2f45;
    border:3px solid #555;color:#eee;font-family:monospace;font-size:15px;
    cursor:pointer;text-align:left;transition:all .15s}
  #quizScreen .opt:hover{background:#3a3a55;border-color:#8ab4d8}

  #replyScreen{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:32px;text-align:center;z-index:70;
    animation:fadeIn .4s}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  #replyScreen.good{background:linear-gradient(#1a3a2a,#0f2418)}
  #replyScreen.soft{background:linear-gradient(#2a2a3a,#1f1f2e)}
  #replyScreen .tag{
    font-size:13px;letter-spacing:4px;margin-bottom:18px}
  #replyScreen.good .tag{color:#4aca6a}
  #replyScreen.soft .tag{color:#8ab4d8}
  #replyScreen .msg{
    font-size:17px;line-height:1.9;color:#fff;
    max-width:560px;margin-bottom:30px}
  #replyScreen .btns{display:flex;gap:12px}
  #replyScreen button{
    padding:12px 24px;background:#ffd966;color:#111;
    border:3px solid #111;font-family:monospace;font-size:15px;
    cursor:pointer;font-weight:bold}
  #replyScreen button:active{transform:translate(1px,1px)}

  /* ========== 全家福 ========== */
  #familyLayer{position:absolute;inset:0;z-index:80;display:none;overflow:hidden}
  #familyLayer.show{display:block}
  #familyLayer .fam-sky{position:absolute;inset:0;
    background:linear-gradient(#a8d8f0 0%,#c8e8ff 60%,#e0f4ff 100%)}
  #familyLayer .fam-sun{position:absolute;top:8%;right:10%;
    width:90px;height:90px;border-radius:50%;
    background:radial-gradient(circle,#fff8a0 0%,#ffe680 50%,rgba(255,230,128,0) 80%);
    box-shadow:0 0 60px #ffe680}
  #familyLayer .msg{
    position:absolute;top:5%;left:50%;transform:translateX(-50%);
    color:#333;font-size:19px;text-align:center;width:90%;
    text-shadow:1px 1px 0 #fff,0 0 8px #fff;
    font-weight:bold;line-height:1.6;z-index:5}
  #familyLayer .fam-group{position:absolute;left:50%;top:52%;
    width:0;height:0;
    transform:translate(-50%,-50%) scale(1);
    transition:transform 1.5s ease-in-out}
  #familyLayer .fam-photo-bg{
    position:absolute;left:50%;top:50%;
    width:720px;height:580px;
    margin-left:-360px;margin-top:-290px;
    background:#fff;
    border:6px solid #fff;
    box-shadow:0 0 40px rgba(0,0,0,.25);
    transform:rotate(10deg) scale(0);
    transition:transform 1.2s ease-out;
    z-index:1}
  #familyLayer .fam-photo-bg.grow{transform:rotate(10deg) scale(1)}
  #familyLayer .fam-people{position:absolute;left:0;top:0;
    width:0;height:0;z-index:2}
  .photoActor{position:absolute;transform:translate(-50%,-100%);
    transition:opacity .5s}
  .photoActor img{display:block;image-rendering:pixelated;
    image-rendering:crisp-edges}
  #familyFlash{position:absolute;inset:0;background:#fff;
    opacity:0;pointer-events:none;z-index:81}
  #familyFlash.flash{animation:photoFlash .8s ease-in-out}
  #whiteOut{position:absolute;inset:0;background:#fff;opacity:0;
    z-index:90;display:none;pointer-events:none}
  #whiteOut.show{display:block;animation:fadeToWhite 2s ease-in forwards}
  #finalText{position:absolute;inset:0;display:flex;
    align-items:center;justify-content:center;
    color:#111;font-size:36px;font-family:serif;
    letter-spacing:8px;opacity:0;
    z-index:91;pointer-events:none;
    transition:opacity 1.5s ease-in}
  #finalText.show{opacity:1}
</style>
</head>
<body>
<div id="stage">

  <div id="sceneLayer">
    <svg id="scene" viewBox="0 0 320 200" preserveAspectRatio="none"></svg>
    <div id="actors"></div>
    <div id="bubble"></div>
    <div id="narr"></div>
    <div id="title"></div>
  </div>

  <div id="chapterScreen">
    <div class="num" id="chNum">0</div>
    <div class="name" id="chName">出生</div>
    <div class="line"></div>
  </div>

  <div id="controls">
    <button id="btnPrev">← 上一页</button>
    <button id="btnNext">下一页 →</button>
  </div>

  <div id="quizScreen"><div id="quizBody"></div></div>
  <div id="replyScreen" class="hidden"></div>

  <div id="familyLayer">
    <div class="fam-sky"></div>
    <div class="fam-sun"></div>
    <div class="fam-group" id="famGroup">
      <div class="fam-photo-bg" id="famPhotoBg"></div>
      <div class="fam-people" id="famPeople"></div>
    </div>
    <div class="msg">感谢家人们的陪伴，<br>最后让我们一起拍张云端全家福吧！</div>
  </div>
  <div id="familyFlash"></div>
  <div id="whiteOut"></div>
  <div id="finalText">未完待续...</div>

</div>

<script>
/* ============================================================
   Web Audio 音效合成引擎
   ============================================================ */
var AC = null;
var audioNodes = [];
var bgmNodes = [];
var bgmEnabled = false;
var lastSfx = null;

function getAC(){
  if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if(AC.state === 'suspended') AC.resume();
  return AC;
}
function stopAllSounds(){
  audioNodes.forEach(function(n){
    try{ if(n.stop) n.stop(); }catch(e){}
    try{ if(n.disconnect) n.disconnect(); }catch(e){}
  });
  audioNodes = [];
}
function stopBgmNodes(){
  bgmNodes.forEach(function(n){
    try{ if(n.stop) n.stop(); }catch(e){}
    try{ if(n.disconnect) n.disconnect(); }catch(e){}
  });
  bgmNodes = [];
}
function trackAudio(node){ audioNodes.push(node); return node; }
function trackBgm(node){ bgmNodes.push(node); return node; }
function noiseBuf(ac, dur){
  var buf = ac.createBuffer(1, Math.max(1, Math.floor(ac.sampleRate * dur)), ac.sampleRate);
  var data = buf.getChannelData(0);
  for(var i=0;i<data.length;i++) data[i] = Math.random()*2-1;
  return buf;
}

/* ---------- 🌌 宇宙出生 ---------- */
function sfxSpace(){
  var ac = getAC(), t = ac.currentTime;
  var chords = [
    [220, 262, 330, 392],
    [175, 220, 262, 330],
    [131, 165, 196, 330],
    [196, 247, 294, 392]
  ];
  chords.forEach(function(chord, ci){
    var start = t + ci * 2;
    chord.forEach(function(freq){
      [-3, 3].forEach(function(detune){
        var osc = trackAudio(ac.createOscillator());
        var gain = trackAudio(ac.createGain());
        osc.type = 'sine';
        osc.frequency.value = freq;
        osc.detune.value = detune;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.045, start + 0.6);
        gain.gain.setValueAtTime(0.045, start + 1.5);
        gain.gain.linearRampToValueAtTime(0, start + 2.1);
        osc.connect(gain).connect(ac.destination);
        osc.start(start); osc.stop(start + 2.2);
      });
    });
  });
  for(var i=0;i<20;i++){
    var start = t + i * 0.4 + Math.random() * 0.2;
    var freq = 1200 + Math.random() * 2400;
    var osc = trackAudio(ac.createOscillator());
    var gain = trackAudio(ac.createGain());
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(0.025, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
    osc.connect(gain).connect(ac.destination);
    osc.start(start); osc.stop(start + 0.4);
  }
}

/* ---------- 👶 婴儿啼哭 ---------- */
function sfxBaby(){
  var ac = getAC(), t = ac.currentTime;
  for(var i=0;i<3;i++){
    var start = t + i * 0.65;
    var osc = trackAudio(ac.createOscillator());
    var gain = trackAudio(ac.createGain());
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(520, start);
    osc.frequency.linearRampToValueAtTime(380, start + 0.5);
    var lfo = trackAudio(ac.createOscillator());
    var lfoGain = trackAudio(ac.createGain());
    lfo.frequency.value = 12;
    lfoGain.gain.value = 30;
    lfo.connect(lfoGain).connect(osc.frequency);
    lfo.start(start); lfo.stop(start + 0.6);
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(0.15, start + 0.05);
    gain.gain.setValueAtTime(0.15, start + 0.4);
    gain.gain.linearRampToValueAtTime(0, start + 0.6);
    osc.connect(gain).connect(ac.destination);
    osc.start(start); osc.stop(start + 0.65);
  }
}

/* ---------- 🌀 妈妈转圈风声 ---------- */
function sfxWind(){
  var ac = getAC(), t = ac.currentTime;
  var noise = trackAudio(ac.createBufferSource());
  noise.buffer = noiseBuf(ac, 6);
  noise.loop = true;
  var filter = trackAudio(ac.createBiquadFilter());
  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(200, t);
  filter.frequency.linearRampToValueAtTime(1500, t + 5);
  filter.frequency.linearRampToValueAtTime(600, t + 6);
  filter.Q.value = 2;
  var gain = trackAudio(ac.createGain());
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(0.15, t + 1);
  gain.gain.linearRampToValueAtTime(0.3, t + 5);
  gain.gain.linearRampToValueAtTime(0, t + 6);
  noise.connect(filter).connect(gain).connect(ac.destination);
  noise.start(t); noise.stop(t + 6);
}

/* ---------- 🏆 奖状喜庆音 ---------- */
function sfxAward(){
  var ac = getAC(), t = ac.currentTime;
  var notes = [523, 659, 784, 1047];
  notes.forEach(function(freq, i){
    var start = t + i * 0.18;
    var osc = trackAudio(ac.createOscillator());
    var gain = trackAudio(ac.createGain());
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(0.12, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
    osc.connect(gain).connect(ac.destination);
    osc.start(start); osc.stop(start + 0.4);
  });
  var start2 = t + 0.18 * 4;
  [523, 659, 784].forEach(function(freq){
    var osc = trackAudio(ac.createOscillator());
    var gain = trackAudio(ac.createGain());
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, start2);
    gain.gain.linearRampToValueAtTime(0.08, start2 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, start2 + 0.8);
    osc.connect(gain).connect(ac.destination);
    osc.start(start2); osc.stop(start2 + 0.9);
  });
}

/* ---------- 💥 苹果爆炸 ---------- */
function sfxBoom(){
  var ac = getAC(), t = ac.currentTime;
  var sub = trackAudio(ac.createOscillator());
  var subGain = trackAudio(ac.createGain());
  sub.type = 'sine';
  sub.frequency.setValueAtTime(200, t);
  sub.frequency.exponentialRampToValueAtTime(20, t + 1.0);
  subGain.gain.setValueAtTime(0.6, t);
  subGain.gain.exponentialRampToValueAtTime(0.001, t + 1.0);
  sub.connect(subGain).connect(ac.destination);
  sub.start(t); sub.stop(t + 1.0);

  var mid = trackAudio(ac.createOscillator());
  var midGain = trackAudio(ac.createGain());
  mid.type = 'sawtooth';
  mid.frequency.setValueAtTime(150, t);
  mid.frequency.exponentialRampToValueAtTime(40, t + 0.6);
  midGain.gain.setValueAtTime(0.35, t);
  midGain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
  mid.connect(midGain).connect(ac.destination);
  mid.start(t); mid.stop(t + 0.6);

  var noise = trackAudio(ac.createBufferSource());
  noise.buffer = noiseBuf(ac, 1.2);
  var lp = trackAudio(ac.createBiquadFilter());
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(10000, t);
  lp.frequency.exponentialRampToValueAtTime(100, t + 1.0);
  lp.Q.value = 1;
  var nGain = trackAudio(ac.createGain());
  nGain.gain.setValueAtTime(0.5, t);
  nGain.gain.exponentialRampToValueAtTime(0.001, t + 1.0);
  noise.connect(lp).connect(nGain).connect(ac.destination);
  noise.start(t); noise.stop(t + 1.0);

  var sparkle = trackAudio(ac.createBufferSource());
  sparkle.buffer = noiseBuf(ac, 0.4);
  var hp = trackAudio(ac.createBiquadFilter());
  hp.type = 'highpass';
  hp.frequency.value = 4000;
  var sGain = trackAudio(ac.createGain());
  sGain.gain.setValueAtTime(0.25, t);
  sGain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
  sparkle.connect(hp).connect(sGain).connect(ac.destination);
  sparkle.start(t + 0.05); sparkle.stop(t + 0.45);
}

/* ---------- 📷 相机快门 ---------- */
function sfxShutter(){
  var ac = getAC(), t = ac.currentTime;
  var n1 = trackAudio(ac.createBufferSource());
  n1.buffer = noiseBuf(ac, 0.025);
  var bp1 = trackAudio(ac.createBiquadFilter());
  bp1.type = 'bandpass';
  bp1.frequency.value = 5000;
  bp1.Q.value = 12;
  var g1 = trackAudio(ac.createGain());
  g1.gain.setValueAtTime(0, t);
  g1.gain.linearRampToValueAtTime(0.5, t + 0.001);
  g1.gain.exponentialRampToValueAtTime(0.001, t + 0.025);
  n1.connect(bp1).connect(g1).connect(ac.destination);
  n1.start(t); n1.stop(t + 0.03);

  var m1 = trackAudio(ac.createOscillator());
  var mg1 = trackAudio(ac.createGain());
  m1.type = 'square';
  m1.frequency.value = 6500;
  mg1.gain.setValueAtTime(0.08, t);
  mg1.gain.exponentialRampToValueAtTime(0.001, t + 0.02);
  m1.connect(mg1).connect(ac.destination);
  m1.start(t); m1.stop(t + 0.025);

  var t2 = t + 0.07;
  var n2 = trackAudio(ac.createBufferSource());
  n2.buffer = noiseBuf(ac, 0.05);
  var bp2 = trackAudio(ac.createBiquadFilter());
  bp2.type = 'bandpass';
  bp2.frequency.value = 2500;
  bp2.Q.value = 8;
  var g2 = trackAudio(ac.createGain());
  g2.gain.setValueAtTime(0, t2);
  g2.gain.linearRampToValueAtTime(0.35, t2 + 0.002);
  g2.gain.exponentialRampToValueAtTime(0.001, t2 + 0.05);
  n2.connect(bp2).connect(g2).connect(ac.destination);
  n2.start(t2); n2.stop(t2 + 0.06);

  var m2 = trackAudio(ac.createOscillator());
  var mg2 = trackAudio(ac.createGain());

/* ---------- ⛸️ 勃拉姆斯圆舞曲 Op.39 No.15（降A大调） ---------- */
function sfxWaltz(){
  var ac = getAC(), t = ac.currentTime;
  var beat = 0.44;

  function note(freq, start, dur, type, vol){
    if(!freq) return;
    var osc = trackAudio(ac.createOscillator());
    var gain = trackAudio(ac.createGain());
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(vol, start + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
    osc.connect(gain).connect(ac.destination);
    osc.start(start); osc.stop(start + dur);
  }

  var Ab3=207.65, Db3=138.59, Eb3=155.56,
      C4=261.63, Db4=277.18, Eb4=311.13, F4=349.23,
      G4=392.00, Ab4=415.30, Bb4=466.16,
      C5=523.25, Db5=554.37, Eb5=622.25;

  var melody = [
    [Eb5, 1],
    [Ab4, 1], [Bb4, 1], [C5, 1],
    [Db5, 2], [C5, 1],
    [Bb4, 2], [Ab4, 1],
    [G4, 1], [F4, 1], [Eb4, 1],
    [F4, 2], [Eb4, 1],
    [F4, 1], [G4, 1], [Ab4, 1],
    [Bb4, 2], [Ab4, 1],
    [Ab4, 3]
  ];

  var mt = t;
  melody.forEach(function(n){
    note(n[0], mt, n[1] * beat * 0.92, 'square', 0.09);
    mt += n[1] * beat;
  });

  var chords = [
    {bass: Ab3, notes: [C4, Eb4]},
    {bass: Db3, notes: [F4, Ab4]},
    {bass: Eb3, notes: [G4, Bb4]},
    {bass: Ab3, notes: [C4, Eb4]},
    {bass: Db3, notes: [F4, Ab4]},
    {bass: Ab3, notes: [C4, Eb4]},
    {bass: Db3, notes: [F4, Ab4]},
    {bass: Eb3, notes: [G4, Bb4]},
    {bass: Ab3, notes: [C4, Eb4]}
  ];

  var ct = t;
  chords.forEach(function(ch){
    note(ch.bass, ct, beat * 0.9, 'triangle', 0.06);
    note(ch.notes[0], ct + beat, beat * 0.7, 'triangle', 0.035);
    note(ch.notes[1], ct + beat, beat * 0.7, 'triangle', 0.035);
    note(ch.notes[0], ct + beat * 2, beat * 0.7, 'triangle', 0.035);
    note(ch.notes[1], ct + beat * 2, beat * 0.7, 'triangle', 0.035);
    ct += beat * 3;
  });
}

function stopAllAnims(){
  animTimers.forEach(function(t){ clearInterval(t); });
  animTimers = [];
  if(orbitRAF){ cancelAnimationFrame(orbitRAF); orbitRAF = null; }
  if(autoAdvanceTimer){ clearTimeout(autoAdvanceTimer); autoAdvanceTimer = null; }
}

function startAnim(imgEl, frames, fallback){
  imgEl.src = frames[0];
  imgEl.onerror = function(){
    this.onerror = null;
    this.src = fallbackSVG(fallback);
  };
  var i = 0;
  var t = setInterval(function(){
    i = (i + 1) % frames.length;
    imgEl.src = frames[i];
    imgEl.onerror = function(){
      this.onerror = null;
      this.src = fallbackSVG(fallback);
    };
  }, FRAME_MS);
  animTimers.push(t);
}

function clearFx(){
  var old = stage.querySelectorAll('.snow,.fw,.petal,.bag,.umbrella,.award-fx,.cert-fx,.prop,.boom,.apple,.orbit-sweep,.scarf,.heart,.starlight,.fruit');
  for(var i=0;i<old.length;i++) old[i].parentNode.removeChild(old[i]);
  if(fwInterval){ clearInterval(fwInterval); fwInterval = null; }

/* ---------- 轨道动画 ---------- */
function startOrbit(orbitEl, centerEl){
  if(orbitRAF){ cancelAnimationFrame(orbitRAF); orbitRAF = null; }
  var st = stage.getBoundingClientRect();
  var cr = centerEl.getBoundingClientRect();
  var cx = cr.left - st.left + cr.width / 2;
  var cy = cr.top - st.top + cr.height * 0.35;

  orbitEl.style.left = '0px';
  orbitEl.style.top = '0px';
  orbitEl.style.bottom = 'auto';
  orbitEl.style.transition = 'none';
  orbitEl.style.transform = 'translate(-50%,-50%)';

  var rx = 240, ry = 110;
  var duration = 4500;
  var totalLaps = 11;
  var startTime = Date.now();
  var imgEl = orbitEl.querySelector('img');
  var grown = false, shrunk = false, finished = false;

  function step(){
    if(finished) return;
    var elapsed = Date.now() - startTime;
    var progress = Math.min(1, elapsed / duration);
    var easeProgress = Math.pow(progress, 1.6);
    var laps = easeProgress * totalLaps;
    var angle = laps * Math.PI * 2;

    if(laps >= 5 && !grown){
      grown = true;
      centerEl.style.transition = 'transform 1.2s ease-in-out';
      centerEl.style.transformOrigin = 'bottom center';
      centerEl.style.transform = 'translateX(-50%) scale(1.8)';
    }
    if(laps >= 10 && !shrunk){
      shrunk = true;
      centerEl.style.transition = 'transform 1.2s ease-in-out';
      centerEl.style.transform = 'translateX(-50%) scale(1)';
    }

    var x = cx + Math.cos(angle) * rx;
    var y = cy + Math.sin(angle) * ry;
    orbitEl.style.left = x + 'px';
    orbitEl.style.top = y + 'px';

    if(progress > 0.5 && imgEl){
      imgEl.style.opacity = '0.4';
      imgEl.style.filter = 'blur(3px)';
    }

    if(progress >= 1){
      finished = true;
      if(orbitRAF){ cancelAnimationFrame(orbitRAF); orbitRAF = null; }
      autoAdvanceTimer = setTimeout(function(){
        if(idx >= 0 && STEPS[idx] && STEPS[idx].fx && STEPS[idx].fx.indexOf('orbit') >= 0){
          next();
        }
      }, 500);
      return;
    }
    orbitRAF = requestAnimationFrame(step);
  }
  orbitRAF = requestAnimationFrame(step);
}

  if(s.fx && s.fx.indexOf('fruit') >= 0){
    clearTransientFx();
  } else {

  }

  var orbitEl = null;
  var centerEl = null;
  var allEls = [];

  (s.actors || []).forEach(function(a){
    var def = SPRITES[a.id];
    if(!def) return;
    var el = document.createElement('div');
    var cls = 'actor';
    if(a.slant) cls += ' slant';
    if(a.orbit) cls += ' orbit';
    if(a.noBob) cls += ' noBob';
    if(a.walk) cls += ' walk';
    if(a.skate) cls += ' skate';

    el.className = cls;

    var bottomOffset = -10;
    if(a.id === 'dad') bottomOffset = -20;
    if(a.slant) bottomOffset = (-2 + a.pos * 25);
    el.style.bottom = bottomOffset + '%';
    var img = document.createElement('img');
    var sz = a.size || SIZE;
    img.style.width = sz + 'px';
    img.style.height = sz + 'px';
    el.appendChild(img);
    actorsEl.appendChild(el);
    startAnim(img, def.frames, def.fallback);
    allEls.push(el);
    if(a.orbit) orbitEl = el;
  });

  if(orbitEl){
    for(var k=0;k<allEls.length;k++){
      if(allEls[k] !== orbitEl){ centerEl = allEls[k]; break; }
    }
    if(centerEl){
      setTimeout(function(){ startOrbit(orbitEl, centerEl); }, 600);
    }
  }

  narr.innerHTML = s.narr ? '<span>'+s.narr+'</span>' : '';
  narr.className = s.narr ? 'show' : '';

  if(s.fx && s.fx.indexOf('snow') >= 0) spawnSnow();
  if(s.fx && s.fx.indexOf('fireworks') >= 0) spawnFireworks();
  if(s.fx && s.fx.indexOf('petals') >= 0) spawnPetals();
  if(s.fx && s.fx.indexOf('award') >= 0) spawnAward();
  if(s.fx && s.fx.indexOf('cert') >= 0) spawnCert();
  if(s.fx && s.fx.indexOf('bag') >= 0) spawnBag();
  if(s.fx && s.fx.indexOf('umbrella') >= 0) spawnUmbrella();
  if(s.fx && s.fx.indexOf('notebook') >= 0) spawnNotebook();
  if(s.fx && s.fx.indexOf('laptop') >= 0) spawnLaptop();
  if(s.fx && s.fx.indexOf('fruit') >= 0) spawnFruit();
  if(s.fx && s.fx.indexOf('appleboom') >= 0) spawnAppleBoom();
  if(s.fx && s.fx.indexOf('sweep') >= 0) spawnSweep();
  if(s.fx && s.fx.indexOf('scarf') >= 0) spawnScarf();
  if(s.fx && s.fx.indexOf('heart') >= 0) spawnHeart();

  /* BGM：只在每章第一幕（章节 1/2/3/4 的开场页）播一次 */
  var prevStep = STEPS[idx - 1];
  var isChapterOpening = prevStep &&
    prevStep.type === 'chapter' &&
    prevStep.num && prevStep.num !== '0';
  if(bgmEnabled && isChapterOpening && !s.bgmPause){
    playBgmOnce();
  } else {
    stopBgmNodes();
  }

  /* 场景专属音效 */
  if(s.sfx){
    setTimeout(function(){ playSfx(s.sfx); }, 200);
  } else {
    lastSfx = null;
  }

  clearTimeout(timer);
  if(s.bubble){
    timer = setTimeout(function(){
      var all = actorsEl.querySelectorAll('.actor');
      var order = (s.actors || []).map(function(a){return a.id;});
      var wi = order.indexOf(s.bubble.who);
      var st = stage.getBoundingClientRect();

      if(wi < 0 || !all[wi]){
        bubble.textContent = s.bubble.text;
        bubble.className = 'show';
        bubble.style.left = '50%';
        bubble.style.transform = 'translateX(-50%)';
        bubble.style.top = '20px';
        return;
      }

      var target = all[wi];
      var r = target.getBoundingClientRect();
      bubble.style.transform = '';
      bubble.textContent = s.bubble.text;
      bubble.className = 'show';

      bubble.style.left = '0px';
      bubble.style.top = Math.max(8, r.top - st.top - 75) + 'px';

      requestAnimationFrame(function(){
        var bw = bubble.offsetWidth;
        var center = r.left - st.left + r.width / 2;
        var left = center - bw / 2;
        left = Math.max(8, Math.min(left, st.width - bw - 8));
        bubble.style.left = left + 'px';
      });
    }, 900);
  }
}

        var dist = 160 + Math.random()*80;
        var p = document.createElement('div');
        p.className = 'fw boom';
        p.style.left = cx + 'px';
        p.style.top = cy + 'px';
        p.style.background = i % 3 === 0 ? '#ff6b6b' : i % 3 === 1 ? '#ffd93d' : '#ff8a4a';
        p.style.width = '12px';
        p.style.height = '12px';
        p.style.setProperty('--dx', Math.cos(ang)*dist + 'px');
        p.style.setProperty('--dy', Math.sin(ang)*dist + 'px');
        stage.appendChild(p);
        setTimeout(function(el){ return function(){
          if(el.parentNode) el.parentNode.removeChild(el);
        }}(p), 1400);
      }
    }, 1600);
  }, 400);
}

/* ================= 翻页 ================= */
function render(i){
  if(i < 0) i = 0;
  if(i >= STEPS.length) i = STEPS.length - 1;
  idx = i;

  var s = STEPS[idx];

  if(s.type === 'chapter'){
    showChapter(s);
  } else if(s.type === 'quiz'){
    showQuiz();
  } else {
    showStep(s);
  }

  btnPrev.disabled = (idx === 0);
  btnNext.disabled = (idx === STEPS.length - 1);
}

function next(){
  if(!bgmEnabled){
    bgmEnabled = true;
    getAC();
  }
  if(idx >= STEPS.length - 1) return;
  render(idx + 1);
}

function prev(){
  if(!bgmEnabled){
    bgmEnabled = true;
    getAC();
  }
  if(idx <= 0) return;
  render(idx - 1);
}

btnNext.onclick = function(e){
  e.stopPropagation();
  next();
};
btnPrev.onclick = function(e){
  e.stopPropagation();
  prev();
};

stage.addEventListener('click', function(e){
  if(e.target.closest && e.target.closest('#controls')) return;
  if(e.target.closest && e.target.closest('#quizScreen')) return;
  if(e.target.closest && e.target.closest('#replyScreen')) return;
  if(!replyScreen.classList.contains('hidden')) return;
  if(quizScreen.classList.contains('show')) return;
  if(familyLayer.classList.contains('show')) return;
  next();
});

document.addEventListener('keydown', function(e){
  if(e.keyCode === 32 || e.keyCode === 39){ e.preventDefault(); next(); }
  if(e.keyCode === 37){ e.preventDefault(); prev(); }
});

render(0);
</script>
