<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>妈妈 · 场景 demo</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#111;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    font-family:monospace}
  #stage{position:relative;width:min(96vw,900px);height:min(62vh,560px);
    min-height:280px;overflow:hidden;cursor:pointer;
    background:linear-gradient(#5c94fc,#9bd0ff);
    transition:background .8s}
  #ground{position:absolute;left:0;right:0;bottom:0;height:20%;
    background:repeating-linear-gradient(90deg,#c86428 0 32px,#a04c18 32px 64px)}
  #hero{position:absolute;bottom:18%;left:50%;
    transform:translateX(-50%);
    transition:left 1.2s ease-in-out;
    animation:bob .5s steps(2) infinite}
  #hero img{display:block;width:64px;height:64px;
    image-rendering:pixelated;image-rendering:crisp-edges}
  @keyframes bob{
    0%{transform:translateX(-50%) translateY(0)}
    100%{transform:translateX(-50%) translateY(-4px)}
  }
  #bubble{position:absolute;padding:10px 14px;background:#fff;color:#111;
    border:4px solid #111;font-size:15px;max-width:60%;opacity:0;
    transition:opacity .3s;z-index:10;line-height:1.5;
    box-shadow:4px 4px 0 rgba(0,0,0,.25)}
  #bubble.show{opacity:1}
  #bubble::after{content:'';position:absolute;left:24px;bottom:-14px;
    border:7px solid transparent;border-top-color:#111}
  #narr{position:absolute;left:0;right:0;bottom:5%;text-align:center;
    color:#fff;text-shadow:0 3px 0 #000;font-size:17px;padding:0 20px;
    opacity:0;transition:opacity .5s;z-index:9}
  #narr.show{opacity:1}
  #hint{position:absolute;right:14px;bottom:10px;color:#fff;font-size:12px;
    opacity:.75;z-index:11;animation:blink 1.6s infinite}
  @keyframes blink{0%,100%{opacity:.75}50%{opacity:.15}}
</style>
</head>
<body>
<div id="stage">
  <div id="ground"></div>
  <div id="hero"><img id="heroImg" alt="mom"></div>
  <div id="bubble"></div>
  <div id="narr"></div>
  <div id="hint">点击继续 →</div>
</div>

<script>
/* ===== 这里换成妈妈的 PNG =====
   把 Piskel 导出的文件命名为 mom.png，
   和这个 HTML 放同一个文件夹。
   现在先用内联 SVG 兜底，保证你打开就能看到效果。 */
var IMG_SRC = "mom.png";

var heroImg = document.getElementById('heroImg');
heroImg.src = IMG_SRC;

/* 兜底：如果 mom.png 不存在，用内联 SVG 画一个"妈妈" */
heroImg.onerror = function(){
  this.onerror = null;
  this.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">' +
    /* 帽子 */
    '<rect x="10" y="0" width="12" height="2" fill="#5b9bd5"/>' +
    '<rect x="9" y="2" width="14" height="3" fill="#5b9bd5"/>' +
    '<rect x="9" y="5" width="14" height="1" fill="#3a6ea5"/>' +
    /* 头发 */
    '<rect x="9" y="6" width="14" height="3" fill="#1a1a1a"/>' +
    /* 脸 */
    '<rect x="11" y="9" width="10" height="8" fill="#f2c29b"/>' +
    /* 眼睛 */
    '<rect x="13" y="11" width="2" height="2" fill="#1a1a1a"/>' +
    '<rect x="17" y="11" width="2" height="2" fill="#1a1a1a"/>' +
    /* 红唇 */
    '<rect x="14" y="14" width="4" height="1" fill="#c0392b"/>' +
    /* 大衣 */
    '<rect x="11" y="17" width="10" height="9" fill="#a04060"/>' +
    /* 内搭 */
    '<rect x="13" y="17" width="6" height="9" fill="#1a1a1a"/>' +
    /* 裤 */
    '<rect x="11" y="26" width="10" height="4" fill="#2a2a2a"/>' +
    /* 脚 */
    '<rect x="12" y="30" width="4" height="2" fill="#e0c0a0"/>' +
    '<rect x="17" y="30" width="4" height="2" fill="#e0c0a0"/>' +
    '</svg>'
  );
};

var hero = document.getElementById('hero');
var stage = document.getElementById('stage');
var bubble = document.getElementById('bubble');
var narr = document.getElementById('narr');

/* ===== 剧本：妈妈出现在不同位置，说不同的话 ===== */
var SCENES = [
  { pos:0.25, sky:['#5c94fc','#9bd0ff'], narr:'妈妈年轻的时候……', bubble:null },
  { pos:0.5,  sky:['#7ec0ee','#c8e8ff'], narr:'她爱穿碎花蓝裙，扎马尾。', bubble:'今天也要开心呀' },
  { pos:0.75, sky:['#3a5a8c','#7ea8d8'], narr:'后来她有了我。', bubble:'吃饭啦——！' },
  { pos:0.4,  sky:['#5c94fc','#9bd0ff'], narr:'她一直在我身边。', bubble:'多穿点，别着凉。' }
];

var idx = -1;
var timer = null;

function showScene(s){
  stage.style.background = 'linear-gradient(' + s.sky[0] + ',' + s.sky[1] + ')';
  hero.style.left = (s.pos * 100) + '%';

  narr.textContent = s.narr || '';
  narr.className = s.narr ? 'show' : '';

  clearTimeout(timer);
  bubble.className = '';
  if(s.bubble){
    timer = setTimeout(function(){
      var r = hero.getBoundingClientRect();
      var st = stage.getBoundingClientRect();
      bubble.textContent = s.bubble;
      bubble.className = 'show';
      var left = r.left - st.left + r.width/2 - 90;
      left = Math.max(8, Math.min(left, st.width - 200));
      bubble.style.left = left + 'px';
      bubble.style.top = Math.max(8, (r.top - st.top - 64)) + 'px';
    }, 1250);
  }
}

function next(){
  if(idx >= SCENES.length - 1) return;
  idx++;
  showScene(SCENES[idx]);
}

stage.addEventListener('click', next);
document.addEventListener('keydown', function(e){
  if(e.code === 'Space' || e.code === 'ArrowRight' ||
     e.keyCode === 32 || e.keyCode === 39){
    e.preventDefault(); next();
  }
});

next();
</script>
</body>
</html>
